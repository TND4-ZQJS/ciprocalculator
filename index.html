<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CI Pro Calculator</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen;
      background: linear-gradient(to bottom right, #e0fce7, #d5eaff);
      padding: 2rem;
      color: #333;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      padding: 2rem;
    }

    h1 {
      text-align: center;
      color: #007f5f;
    }

    label {
      display: block;
      margin-top: 1rem;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 8px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-top: 0.25rem;
    }

    .button {
      margin-top: 2rem;
      background-color: #ffb703;
      color: #000;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
    }

    .results {
      margin-top: 2rem;
      background: #f9f9f9;
      padding: 1rem;
      border-radius: 8px;
      border: 1px dashed #ccc;
    }

    .result-line {
      margin: 0.5rem 0;
      font-size: 1.1rem;
    }

    .highlight {
      font-weight: bold;
      color: #d00000;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>CI Pro Calculator</h1>

  <!-- General Inputs -->
  <label>Age</label>
  <input type="number" id="age" value="35" min="18" max="70">

  <label>Years of Income Replacement</label>
  <input type="number" id="incomeYears" value="5" min="1" max="20">

  <!-- Living Expenses -->
  <h3>Monthly Living Expenses</h3>
  <label>Home Loan (RM)</label><input type="number" id="homeLoan" value="3000">
  <label>Car Loan (RM)</label><input type="number" id="carLoan" value="2000">
  <label>Car Insurance (RM/year)</label><input type="number" id="carInsurance" value="1000">
  <label>Parents Support (RM)</label><input type="number" id="parents" value="1000">
  <label>Education Fund (RM)</label><input type="number" id="education" value="1000">
  <label>Retirement Fund (RM)</label><input type="number" id="retirement" value="1000">
  <label>Utility Bills (RM)</label><input type="number" id="utilities" value="500">
  <label>Meals (Organic Food) (RM)</label><input type="number" id="meals" value="1000">
  <label>Phone / Petrol / Parking (RM)</label><input type="number" id="transport" value="300">
  <label>Leisure / Holiday (RM)</label><input type="number" id="leisure" value="50">

  <!-- Medical Expenses -->
  <h3>Monthly Medical Expenses (Post-CI)</h3>
  <label>Long-term Medication (RM)</label><input type="number" id="medication" value="1000">
  <label>TCM / Supplements (RM)</label><input type="number" id="tcm" value="500">

  <button class="button" onclick="calculate()">Calculate</button>

  <!-- Results -->
  <div class="results" id="result" style="display: none;">
    <div class="result-line">🧾 <span class="highlight" id="livingTotal">...</span> — Income Replacement Total</div>
    <div class="result-line">💊 <span class="highlight" id="medicalTotal">...</span> — Medical Expenses Total</div>
    <div class="result-line">🧮 <span class="highlight" id="baseTotal">...</span> — CI Pro Base Total</div>
    <div class="result-line">📈 <span class="highlight" id="inflationTotal">...</span> — Inflation-Adjusted Total (5%/yr)</div>
  </div>
</div>

<script>
  function calculate() {
    const age = parseInt(document.getElementById("age").value);
    const incomeYears = parseInt(document.getElementById("incomeYears").value);

    // Living expenses (monthly, except car insurance yearly)
    const carInsurance = parseFloat(document.getElementById("carInsurance").value) / 12;
    const expenses = [
      "homeLoan", "carLoan", "parents", "education", "retirement",
      "utilities", "meals", "transport", "leisure"
    ];

    let totalMonthly = carInsurance;
    expenses.forEach(id => {
      totalMonthly += parseFloat(document.getElementById(id).value) || 0;
    });

    const livingTotal = totalMonthly * 12 * incomeYears;

    // Medical expenses
    const medication = parseFloat(document.getElementById("medication").value);
    const tcm = parseFloat(document.getElementById("tcm").value);
    const medicalYears = 80 - age;
    const medicalTotal = (medication + tcm) * 12 * medicalYears;

    const baseTotal = livingTotal + medicalTotal;

    // Inflation-adjusted total (5% compound)
    const inflationAdjusted = baseTotal * Math.pow(1.05, medicalYears);

    // Display results
    document.getElementById("livingTotal").innerText = "RM " + livingTotal.toLocaleString();
    document.getElementById("medicalTotal").innerText = "RM " + medicalTotal.toLocaleString();
    document.getElementById("baseTotal").innerText = "RM " + baseTotal.toLocaleString();
    document.getElementById("inflationTotal").innerText = "RM " + Math.round(inflationAdjusted).toLocaleString();

    document.getElementById("result").style.display = "block";
  }
</script>

</body>
</html>
